  <circle cx="10.5" cy="15.5" r="1.1" fill="rgba(255,255,255,0.35)"/>
  <circle cx="17.5" cy="15.5" r="1.1" fill="rgba(255,255,255,0.35)"/>
  <circle cx="24.5" cy="15.5" r="1.1" fill="rgba(255,255,255,0.35)"/>
  <circle cx="13.5" cy="8.5"  r="1.0" fill="rgba(255,255,255,0.35)"/>
  <circle cx="21.5" cy="8.5"  r="1.0" fill="rgba(255,255,255,0.35)"/>
  <circle cx="17.5" cy="3.2"  r="0.9" fill="rgba(255,255,255,0.35)"/>

  <!-- Calyx / leaves -->
  <path d="M13 3 Q10 -1 7 1 Q11 2.5 13 4Z"   fill="#5C7A28"/>
  <path d="M19 3 Q22 -1 25 1 Q21 2.5 19 4Z"  fill="#4A6820"/>
