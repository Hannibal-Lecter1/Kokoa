<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bottom row: 3 drupelets -->
  <circle cx="9"  cy="25" r="4.5" fill="#C41A3B"/>
  <circle cx="16" cy="25" r="4.5" fill="#E8284F"/>
  <circle cx="23" cy="25" r="4.5" fill="#C41A3B"/>

  <!-- Middle row: 3 drupelets (offset) -->
  <circle cx="9"  cy="17" r="4.2" fill="#E8284F"/>
  <circle cx="16" cy="17" r="4.2" fill="#C41A3B"/>
  <circle cx="23" cy="17" r="4.2" fill="#E8284F"/>

  <!-- Upper row: 2 drupelets -->
  <circle cx="12" cy="10" r="3.8" fill="#C41A3B"/>
  <circle cx="20" cy="10" r="3.8" fill="#E8284F"/>

  <!-- Top: 1 drupelet -->
